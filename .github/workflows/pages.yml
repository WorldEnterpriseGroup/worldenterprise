# GitHub Pages deploy. The GitLab pipeline verifies the source and mirrors it to gh-pages, and this workflow does not trust that:
# it rebuilds the pushed source with the release gate on and no allowances, audits the exact dist it uploads (the final dist, after
# CNAME is copied in) and deploys only that. Promoting the GitLab artifact itself is not possible without a cross-platform token.
name: pages

on:
  push:
    branches: [gh-pages]
  # Re-runs a failed deploy of what is on gh-pages. Every job is guarded to that ref, so a dispatch from any other branch does nothing.
  workflow_dispatch:

# No default token scopes. Each job grants only what it uses.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/gh-pages'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      PUBLIC_WE_INTAKE_API_URL: ${{ vars.PUBLIC_WE_INTAKE_API_URL }}
      PUBLIC_WE_NEWSLETTER_API_URL: ${{ vars.PUBLIC_WE_NEWSLETTER_API_URL }}
      # Strict: any release problem (launched route missing, draft content, a launched form that is disabled) fails the job.
      RELEASE_ALLOW: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run test:unit
      - name: Release build (PUBLIC_RELEASE=1) and release gate
        run: npm run verify:release
      - run: npm run audit:contrast
      - run: npm run audit:claims
      - name: Export route ledger
        run: node scripts/lib/export-ledger.mjs reports/ledger.json
      - name: Custom domain
        run: cp CNAME dist/CNAME
      - name: Published-output gate (allowlist, leaks, source maps, CNAME in dist, shell files)
        run: node scripts/lib/audit-dist.mjs --dist dist --cname CNAME --cname-in-dist
      - name: CSP coverage (every inline block hashed, every form origin allowed)
        run: node scripts/audit-csp.mjs --dist dist
      - name: Route ledger, links and image audits
        run: |
          set -eu
          node scripts/audit-route-ledger.mjs --dist dist --ledger reports/ledger.json --strict
          node scripts/audit-links.mjs --dist dist --ledger reports/ledger.json --strict
          node scripts/audit-images.mjs --dist dist
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/gh-pages'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
