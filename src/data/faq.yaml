# FAQ entries (WP-08). Schema: src/content.config.ts, collection "faq". Answers follow SAGE-PLAN 7.5 and cite only enabled claims.
- id: what-is-we
  question: "What is World Enterprise Incubator?"
  answer: "World Enterprise Incubator is a digital incubator for SaaS, run by World Enterprise Group Incorporated. Dedicated team seats, steered by WE, take a founder from first idea toward first customers and the evidence an investor will ask for. The work is fully remote."
  group: "About WE"
  claimsUsed: [C-01, C-03, C-18]
  related: [digital-incubator-meaning, what-is-a-seat]
- id: is-it-an-accelerator
  question: "Is WE an accelerator?"
  answer: "WE describes itself as a digital incubator. It builds with your company through dedicated team seats. This site does not describe a cohort calendar or a demo day."
  group: "About WE"
  claimsUsed: [C-01, C-02]
  related: [what-is-we, digital-incubator-meaning]
- id: digital-incubator-meaning
  question: "What does \"digital incubator\" mean?"
  answer: "It means the incubator is fully digital. There are no physical offices. Planning, building and reviewing all happen online, so you can work with WE from wherever you are."
  group: "About WE"
  claimsUsed: [C-01]
  related: [relocate]
- id: what-is-a-seat
  question: "What is a seat?"
  answer: "A seat is a dedicated role on your team, filled from WE's offshore team, that works on your company. WE steers the team and manages its subcontractors, so you have one accountable party rather than a set of separate vendors."
  group: "The seat model"
  claimsUsed: [C-02, C-03]
  related: [scale-by-notice]
- id: scale-by-notice
  question: "Can the team scale up or down?"
  answer: "Yes. Seats can be scaled up or down by notice. The notice mechanics are set out in the written agreement."
  group: "The seat model"
  claimsUsed: [C-02]
  related: [what-is-a-seat]
- id: relocate
  question: "Do I have to relocate?"
  answer: "No. WE is fully remote, with no physical offices, so there is nothing to relocate to and no visiting address."
  group: "The seat model"
  claimsUsed: [C-01]
  related: [digital-incubator-meaning]
- id: how-to-apply
  question: "How do I apply?"
  answer: "Use the application form on the Apply page. Tell WE about your idea and where you are, and WE will reply with next steps."
  group: "Applying and cost"
  claimsUsed: [C-01]
  related: [what-stage]
- id: what-stage
  question: "What stage should my company be at?"
  answer: "WE builds with founders from first idea to first customers. If you want to validate a problem, build a first version or earn your first customers, you are in range."
  group: "Applying and cost"
  claimsUsed: [C-04]
  related: [not-for]
- id: promise-funding
  question: "Does WE promise my company will raise money?"
  answer: "No. WE makes no promise of funding. The work helps you prepare the evidence investors ask for. It does not predict that any company will raise money."
  group: "Scope and limits"
  claimsUsed: [C-05]
  related: [not-for]
- id: cost
  question: "What does it cost?"
