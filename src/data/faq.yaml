- id: start-dream
  question: "What happens in Dream?"
  answer: "Dream is the first stage: frame the problem, talk to real customers and decide on evidence whether to build, change course or stop. Sizing the market is built from counts you can check, not from third-party reports. Dream does not predict whether the idea will succeed."
  group: "Dream, Build and Grow"
  audience: startup
  seeAlso: [/program/dream/]
  claimsUsed: [C-04]
  related: [start-join-stage, start-build]
- id: start-build
  question: "What happens in Build?"
  answer: "Build turns the validated idea into a first release: design the product, cut the first release to what the evidence supports and ship it in reviewed cycles. Each cycle ends with something you can open and a review with you. Build does not promise a ship date and does not include production operations or round-the-clock support."
  group: "Dream, Build and Grow"
  audience: startup
  seeAlso: [/program/build/]
  claimsUsed: [C-04]
  related: [start-dream, start-grow]
- id: start-grow
  question: "What happens in Grow?"
  answer: "Grow is the stage for winning first customers, reporting metrics consistently and assembling the evidence investors ask for. WE does not promise a meeting with any investor and does not run a raise on your behalf. WE makes no promise of funding."
  group: "Dream, Build and Grow"
  audience: startup
  seeAlso: [/program/grow/]
  claimsUsed: [C-04, C-05]
  related: [promise-funding, start-build]
- id: start-lines
  question: "What do the service lines cover?"
  answer: "The service lines run from A to G. They cover brand and identity, product and IT development, customer relations and market development, business management and operations, digital incubation, fundability and investor readiness, and professional-services coordination. Each line says what it does not cover."
