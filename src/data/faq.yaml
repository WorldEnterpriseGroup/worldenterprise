- id: start-application
  question: "What does the application ask for?"
  answer: "The application is short and asks only what WE needs to judge fit. It asks who you are, where the idea stands and, if you add it, the team you have in mind. The team, the package and a longer description of what you are building are optional."
  group: "Applying"
  audience: startup
  seeAlso: [/apply/]
  claimsUsed: []
  related: [how-to-apply, start-after-apply]
- id: start-after-apply
  question: "What happens after I apply?"
  answer: "WE reviews each application and replies to the email address you give. WE does not state a response time on this site. If the idea fits, WE and the founder choose which service lines the company needs and what each one will and will not cover. The scope is written down in an agreement, so both companies work from the same page."
  group: "Applying"
  audience: startup
  seeAlso: [/program/how-we-decide/]
  claimsUsed: []
  related: [how-to-apply, start-application]
- id: start-fit
  question: "How do I know whether I am a good fit?"
  answer: "You are a good fit if you have a SaaS idea or an early product and can say who it is for. You can describe the problem as the customer would, and you are willing to test the idea with real customers, including when the answers are unwelcome. You can make decisions for the company and join a review at each cycle."
  group: "Applying"
  audience: startup
  seeAlso: [/program/who-its-for/, /program/how-we-decide/]
  claimsUsed: []
  related: [what-stage, start-not-fit]
- id: start-not-fit
  question: "When is WE probably not the right fit?"
  answer: "WE is probably not the right fit if you need a physical office, on-site staff or in-person work, because WE is fully remote. It is also probably not the right fit if you are looking for money rather than a team, or if your idea is not a software-as-a-service product. A clear no is as useful to you as a yes."
  group: "Applying"
  audience: startup
  seeAlso: [/program/who-its-for/]
  claimsUsed: [C-01, C-05]
  related: [not-for, promise-funding]
