# The intake service pipeline (WP-61). Included from .gitlab-ci.yml (`include: local`, guarded by `rules: exists`), so it only
# adds jobs; it declares no stage of its own. Stages are the root file's: preflight, qa, deploy, mirror.
#
# Always on (every branch pipeline, no credentials, nothing provisioned):
#   intake:test    typecheck, unit tests with fakes, the Bicep compile, the what-if gate test, the package build
#   intake:render  the brief renderer's self-test (HTML and PDF), and the real briefs once they exist
#
# Present only on demo, only when the operator has set the variables named in .intake-operator-ready, and always manual:
#   intake:deploy    what-if (refuses a deleting plan), deploy the Bicep, ship the Function package, publish rendered briefs
#   intake:dataverse apply infra/intake/dataverse/definition.json to the Dataverse environment (idempotent, never deletes)
#   intake:verify    the direct Function host answers 403 and public /api/health is configured with the security headers
#
# Operator variables (names only; values live in GitLab CI/CD variables, protected, and in Azure Key Vault): see
# docs/intake-runbook.md. Nothing here creates a variable, a secret or an Azure object by itself.

variables:
  # Pinned, with the digest of the release asset, so a changed download cannot slip in.
  INTAKE_BICEP_VERSION: "v0.48.1"
  INTAKE_BICEP_SHA256: "b09ec25a9d376c1f8e33ede6ed22b587f915ad68488d5db77a6f9541748c7f6e"
  INTAKE_AZURE_CLI_VERSION: "2.91.0"

.intake-bicep:
  before_script:
    # The job user cannot write to /usr/local/bin, so the binary lives in the project directory and goes on PATH.
    - mkdir -p "${CI_PROJECT_DIR}/.tools"
    - curl --fail --silent --show-error --location --output "${CI_PROJECT_DIR}/.tools/bicep" "https://github.com/Azure/bicep/releases/download/${INTAKE_BICEP_VERSION}/bicep-linux-x64"
    - echo "${INTAKE_BICEP_SHA256}  ${CI_PROJECT_DIR}/.tools/bicep" | sha256sum --check --status
    - chmod +x "${CI_PROJECT_DIR}/.tools/bicep"
    - export PATH="${CI_PROJECT_DIR}/.tools:${PATH}"
  variables:
    DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
    BICEP_BIN: "${CI_PROJECT_DIR}/.tools/bicep"
    REQUIRE_BICEP: "1"

intake:test:
  extends: [.intake-bicep]
  stage: preflight
  image: "${NODE_FULL_IMAGE}"
  interruptible: true
  cache:
    key:
      files:
        - infra/intake/package-lock.json
    paths:
      - .npm/
    policy: pull-push
  script:
    - node --version
    - cd infra/intake
    - npm ci --prefer-offline --no-audit --no-fund
    - npm run typecheck
    - npm test
    - node render/render.mjs --self-test --no-pdf
    - node dataverse/apply.ts --validate
    - npm run build
    - ls -l dist/function.zip
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - infra/intake/dist/function.zip
  rules:
    - if: '$CI_COMMIT_BRANCH'

# Runs in the Playwright image, which carries the Chromium the PDF is printed with; nothing is installed.
intake:render:
  stage: qa
  image: "${PLAYWRIGHT_IMAGE}"
  needs: []
  interruptible: true
  script:
    - node --version
    - node infra/intake/render/render.mjs --self-test
    - |
      if ls infra/intake/briefs/*.md >/dev/null 2>&1; then
        node infra/intake/render/render.mjs --briefs infra/intake/briefs --out infra/intake/render/out
      else
        echo "infra/intake/briefs has no briefs yet; only the renderer self-test ran"
      fi
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - infra/intake/render/out/
  rules:
    - if: '$CI_COMMIT_BRANCH'

# The gate for every job below. All of these must exist as protected CI/CD variables, and the branch must be demo. Without them
# the job is not created, so an unconfigured pipeline stays green and shows no deploy job.
.intake-operator-ready:
  rules:
    - if: '$CI_COMMIT_BRANCH == "demo" && $INTAKE_AZURE_CLIENT_ID && $INTAKE_AZURE_TENANT_ID && $INTAKE_AZURE_SUBSCRIPTION_ID && $INTAKE_FRONT_DOOR_ID && $INTAKE_DATAVERSE_URL'
      when: manual
    - when: never

# Node plus the Azure CLI from PyPI at a pinned version. The pipeline signs in with its GitLab OIDC token (workload identity
# federation): there is no client secret anywhere.
.intake-azure:
  extends: [.intake-bicep, .intake-operator-ready]
  image: "${NODE_FULL_IMAGE}"
  id_tokens:
    AZURE_ID_TOKEN:
      aud: api://AzureADTokenExchange
  before_script:
    - !reference [.intake-bicep, before_script]
    - python3 -m venv /opt/az
    - /opt/az/bin/pip install --quiet --disable-pip-version-check "azure-cli==${INTAKE_AZURE_CLI_VERSION}"
    - export PATH="/opt/az/bin:${PATH}"
    - az config set bicep.use_binary_from_path=true core.only_show_errors=true core.collect_telemetry=false
    - az login --service-principal --username "${INTAKE_AZURE_CLIENT_ID}" --tenant "${INTAKE_AZURE_TENANT_ID}" --federated-token "${AZURE_ID_TOKEN}" --output none
    - az account set --subscription "${INTAKE_AZURE_SUBSCRIPTION_ID}"

intake:deploy:
  extends: [.intake-azure]
  stage: deploy
  needs:
    - job: intake:test
      artifacts: true
    - job: intake:render
      artifacts: true
  resource_group: intake-demo
  script:
    - export PATH="/opt/az/bin:${PATH}"
    - test -f infra/intake/dist/function.zip || { echo "infra/intake/dist/function.zip is missing, so run intake:test first"; exit 1; }
    - cd infra/intake
    # Every operator input becomes a deployment parameter by name. Optional ones are passed only when set.
    - |
      params=(frontDoorId="${INTAKE_FRONT_DOOR_ID}" dataverseUrl="${INTAKE_DATAVERSE_URL}")
      [ -n "${INTAKE_LOCATION:-}" ] && params+=(location="${INTAKE_LOCATION}")
      [ -n "${INTAKE_SENDER_ADDRESS:-}" ] && params+=(senderAddress="${INTAKE_SENDER_ADDRESS}")
      [ -n "${INTAKE_MAIL_FOOTER_ADDRESS:-}" ] && params+=(mailFooterAddress="${INTAKE_MAIL_FOOTER_ADDRESS}")
      [ -n "${INTAKE_WEBHOOK_URL:-}" ] && params+=(webhookUrl="${INTAKE_WEBHOOK_URL}")
      [ -n "${INTAKE_ALERT_EMAIL:-}" ] && params+=(alertEmail="${INTAKE_ALERT_EMAIL}")
      [ -n "${INTAKE_DEPLOY_PRINCIPAL_ID:-}" ] && params+=(deployPrincipalId="${INTAKE_DEPLOY_PRINCIPAL_ID}")
      [ -n "${INTAKE_NURTURE_ENABLED:-}" ] && params+=(nurtureEnabled="${INTAKE_NURTURE_ENABLED}")
      az deployment sub what-if --name worldenterprise-intake --location "${INTAKE_LOCATION:-eastus}" --template-file iac/main.bicep --parameters "${params[@]}" --no-pretty-print --output json > whatif.json
      node iac/whatif-gate.mjs whatif.json
      az deployment sub create --name worldenterprise-intake --location "${INTAKE_LOCATION:-eastus}" --template-file iac/main.bicep --parameters "${params[@]}" --output none
      az deployment sub show --name worldenterprise-intake --query properties.outputs --output json > outputs.json
      {
        echo "INTAKE_RESOURCE_GROUP=$(node -p "require('./outputs.json').resourceGroupName.value")"
        echo "INTAKE_STORAGE_ACCOUNT=$(node -p "require('./outputs.json').storageAccountName.value")"
        echo "INTAKE_FUNCTION_APP=$(node -p "require('./outputs.json').functionAppName.value")"
        echo "INTAKE_ORIGIN_HOST=$(node -p "require('./outputs.json').functionOriginHost.value")"
        echo "INTAKE_IDENTITY_CLIENT_ID=$(node -p "require('./outputs.json').identityClientId.value")"
      } > ../../intake.env
    - . ../../intake.env
    - az functionapp deployment source config-zip --resource-group "${INTAKE_RESOURCE_GROUP}" --name "${INTAKE_FUNCTION_APP}" --src dist/function.zip
    # Briefs are published only when the render job produced a registry. Versions already published are kept; see render/publish.mjs.
    - |
      if [ -f render/out/briefs.json ]; then
        node render/publish.mjs --out render/out --account "${INTAKE_STORAGE_ACCOUNT}"
      else
        echo "no rendered briefs to publish"
      fi
    - echo "The Front Door route (OP-FD) points at ${INTAKE_ORIGIN_HOST}; see docs/intake-runbook.md."
  artifacts:
    reports:
      dotenv: intake.env
    paths:
      - infra/intake/whatif.json
    expire_in: 1 week
    when: always

intake:dataverse:
  extends: [.intake-azure]
  stage: deploy
  needs:
    - job: intake:deploy
      artifacts: true
      optional: true
  resource_group: intake-demo
  script:
    - export PATH="/opt/az/bin:${PATH}"
    - test -n "${INTAKE_IDENTITY_CLIENT_ID:-}" || { echo "INTAKE_IDENTITY_CLIENT_ID is unset, so run intake:deploy first or set it to the Bicep identityClientId output"; exit 1; }
    - cd infra/intake
    # The token goes straight into the environment of one process. It is never written to a file or echoed.
    - DATAVERSE_URL="${INTAKE_DATAVERSE_URL}" DATAVERSE_TOKEN="$(az account get-access-token --resource "${INTAKE_DATAVERSE_URL}" --query accessToken --output tsv)" node dataverse/apply.ts

intake:verify:
  extends: [.intake-operator-ready]
  stage: deploy
  image: "${NODE_IMAGE}"
  needs:
    - job: intake:deploy
      artifacts: true
      optional: true
  script:
    - test -n "${INTAKE_ORIGIN_HOST:-}" || { echo "INTAKE_ORIGIN_HOST is unset, so run intake:deploy first or set it to the Bicep functionOriginHost output"; exit 1; }
    - ORIGIN_HOST="${INTAKE_ORIGIN_HOST}" API_HOST="${INTAKE_API_HOST:-intake.worldenterprise.org}" node infra/intake/iac/verify.mjs
