# World Enterprise Incubator: GitLab is the release authority.
#
#   preflight  verify:static   type check, unit tests, contrast, production-shaped build, route ledger export
#              check:ownership  wp/* branches only: the diff stays inside the branch owner's paths
#   qa         audit:*          static audits of dist/ (claims, images, links, ledger, dist, a11y, seo, schema, tokens; geo once scripts/audit-geo.mjs exists; gated once a brief exists in infra/intake/briefs)
#              e2e:*            Playwright suites against dist/ served by scripts/lib/serve.mjs (six projects; e2e:wave7 and e2e:wave8 add two each once their folder has a spec)
#              qa:lighthouse    mobile Lighthouse on eight routes with the SAGE-PLAN 6.9 budgets
#              verify:release   PUBLIC_RELEASE=1 build (RELEASE_ALLOW tolerates operator-gated items)
#   deploy     pages            internal preview (demo only), built from source with a Node image
#   mirror     mirror           release-* tags only (decision DP-1): manual, needs RELEASE_APPROVED, confirms GitHub has the commit (it does not push)
#
# Blocking policy. verify:static and check:ownership always block. Every qa job blocks: WP-15 set QA_STRICT=1 below once one wp/15
# pipeline passed every qa job (decision I-10). Removing that variable returns wp/* branches and demo to allow_failure, which a work
# package merge may use while a heavy suite is being repaired; gh-pages, and any branch whose name ends in "negatives", is always
# strict. The negatives branch is how each gate is proven able to fail.
#
# The Launch Sequence include is pinned to an immutable commit (D-6).

include:
  - project: 'DroidOpsInc/launch-sequence'
    ref: 6c547b757f89ec5552b5d769dfa64700e9bd4289 # immutable Launch Sequence commit, checked 2026-10-06
    file: '/pipelines/static-site.yml'
  # The intake service (WP-61, contracts section 4) keeps its own jobs in infra/intake/ci.yml. The include is added once, here, and is
  # inert until that file exists, so WP-61 never edits this file. Nothing under infra/ reaches the GitHub mirror (decision R-2).
  - local: /infra/intake/ci.yml
    rules:
      - exists:
          - infra/intake/ci.yml

# The include declares preflight, deploy and mirror. qa is added between preflight and deploy.
stages:
  - preflight
  - qa
  - deploy
  - mirror

variables:
  GITHUB_REPO: "WorldEnterpriseGroup/worldenterprise"
  NODE_IMAGE: "${IMAGE_REGISTRY}/dockerhub-proxy/library/node:24-alpine"
  # The full image ships git. verify:static and check:ownership need it: sitemap lastmod and the ownership diff read history.
  NODE_FULL_IMAGE: "${IMAGE_REGISTRY}/dockerhub-proxy/library/node:24"
  # Full history for every job: sitemap lastmod reads git dates, check:ownership diffs against demo.
  GIT_DEPTH: "0"
  PLAYWRIGHT_IMAGE: "${IMAGE_REGISTRY}/mcr-proxy/playwright:v1.63.0-noble"
  npm_config_cache: "${CI_PROJECT_DIR}/.npm"
  npm_config_update_notifier: "false"
  # The one operator-gated item verify:release tolerates off gh-pages: the intake and newsletter endpoints are not provisioned,
  # so the launched /apply/ and /contact/ forms render disabled. Every launch route exists and no draft remains. gh-pages
  # overrides this to empty, so the endpoints must exist before production ships.
  #
  # Wave 8 (decision W8-31, contracts section 10) also tolerates the pages it pre-registered: the page families (founders segments,
  # industries, compare, journey, briefs), the investor and partner pages, the brand story and three founder tools are launch:true in
  # src/data/routes.ts before their packages write the page. Each shape is anchored at both ends, so a launched route anywhere else
  # that does not exist still fails. The wave 7 patterns are gone: those pages exist, and the four framework pages WP-48 never built
  # are launch:false. WP-99 removes the wave 8 shapes when the last page lands, leaving the form routes. A release tag and gh-pages
  # set RELEASE_ALLOW to empty (verify:release below), so none of this can reach a release. expand: false keeps the `$`.
  RELEASE_ALLOW:
    value: '^launched form route,^launch:true route does not exist: (/(?:founders/[a-z0-9-]+|industries|industries/[a-z0-9-]+|compare|compare/[a-z0-9-]+|journey|journey/[a-z0-9-]+|briefs|briefs/[a-z0-9-]+|investors/(?:meet-startups|what-you-can-see|readiness-criteria|showcase-format|faq|interest|interest/thanks)|network/partners|network/partners/(?:categories|how-it-works|faq|enquire|enquire/thanks)|about/brand-story|tools/(?:runway-calculator|pricing-page-checker|cap-table-explainer))/)$'
    expand: false
  # Every qa job blocks on every branch (decision I-10). Set by WP-15 after a wp/15 pipeline passed all of them.
  QA_STRICT: "1"

# npm packages are cached per lockfile. Playwright browsers ship inside the Playwright image, so nothing is downloaded per job.
.npm-cache:
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
    policy: pull-push

# Strict on gh-pages, on *negatives branches, on release-* tags and when QA_STRICT=1; otherwise allowed to fail.
.qa-rules:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^release-/'
      allow_failure: false
    - if: '$CI_COMMIT_BRANCH == "gh-pages" || $CI_COMMIT_BRANCH =~ /negatives$/ || $QA_STRICT == "1"'
      allow_failure: false
    - if: '$CI_COMMIT_BRANCH'
      allow_failure: true

.needs-build:
  needs:
    - job: verify:static
      artifacts: true

.audit:
  extends: [.qa-rules, .needs-build]
  stage: qa
  image: "${NODE_IMAGE}"
  interruptible: true
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - reports/

.e2e:
  extends: [.qa-rules, .npm-cache, .needs-build]
  stage: qa
  image: "${PLAYWRIGHT_IMAGE}"
  interruptible: true
  variables:
    CI: "1"
  before_script:
    - node --version
    - npm ci --prefer-offline --no-audit --no-fund
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - test-results/
      - playwright-report/
      - reports/

verify:static:
  extends: [.npm-cache]
  stage: preflight
  image: "${NODE_FULL_IMAGE}" # ships git, so sitemap lastmod is computed here as it is in the release build
  interruptible: true
  variables:
    # The verify build includes the dev-only styleguide route; the nav and footer render only routes that exist.
    PUBLIC_STYLEGUIDE: "1"
  script:
    - node --version
    - npm --version
    - npm ci --prefer-offline --no-audit --no-fund
    - npm run check
    - npm run test:unit
    - npm run audit:contrast
    - npm run audit:claims:selftest
    - npm run build
    - node scripts/lib/export-ledger.mjs reports/ledger.json
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - dist/
      - reports/ledger.json
  rules:
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG =~ /^release-/'

check:ownership:
  stage: preflight
  image: "${NODE_FULL_IMAGE}"
  interruptible: true
  before_script:
    - git fetch --no-tags origin demo:refs/remotes/origin/demo
  script:
    - node scripts/check-ownership.mjs
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^wp\//'

# Also writes reports/counsel-review.md: every rendered sentence about investors and Investor Introductions, for the counsel review
# that gates the release (.astro-magazine/release/RELEASE.md section 8). It reads dist and never fails on content.
audit:claims:
  extends: [.audit]
  script:
    - npm run audit:claims
    - node scripts/ci/counsel-extract.mjs --dist dist --out reports/counsel-review.md
    # Also in the job log, so it can be read without downloading the artifact.
    - cat reports/counsel-review.md

audit:images:
  extends: [.audit]
  script:
    - npm run audit:images

audit:links:
  extends: [.audit]
  script:
    - npm run audit:links

audit:ledger:
  extends: [.audit]
  script:
    - npm run audit:ledger

# Published-output allowlist and leak scan (audit:dist), and CSP hash coverage of every inline block (audit:csp). Both run and both
# count, so one red audit does not hide the other.
audit:dist:
  extends: [.audit]
  script:
    - |
      status=0
      npm run audit:dist || status=1
      npm run audit:csp || status=1
      exit "$status"

audit:a11y:
  extends: [.audit]
  script:
    - npm run audit:a11y

# SEO and titles (WP-09), JSON-LD (WP-09) and design tokens (WP-13). One job, three audits: every audit runs and every failure
# counts, so one red audit does not hide the next.
audit:wired:
  extends: [.audit]
  script:
    - |
      status=0
      npm run audit:seo || status=1
      npm run audit:jsonld || status=1
      npm run audit:tokens || status=1
      exit "$status"

# Route smoke, element-level layout fit at 1440, 390 and 320 px, folds, shell, screenshots at 1440 and 390 (JPEG, attached as artifacts).
#
# Artifact size. Every route and project writes a full-page JPEG to test-results/screenshots/ and attaches it, and the HTML report copies each
# attachment into playwright-report/data/, so the screenshots were stored twice. The 2026-10-10 archive was 931.5 MB (pipeline 65783), and the next
# wave 8 articles pushed it past the coordinator's 1 GB upload limit (413 Request Entity Too Large, job 1130973, after all tests passed).
# The copies in the report are the ones a reviewer opens, so the loose ones are excluded; traces and the rest still upload on failure.
# The archive is kept 3 days, not a week: it is the one large artifact and object storage runs on single-copy volumes after the 2026-10-10 outage.
e2e:routes:
  extends: [.e2e]
  artifacts:
    exclude:
      - test-results/screenshots/**
    expire_in: 3 days
  script:
    # `layout.spec` and not `layout`: the filter is a regular expression on the file path, and `layout` would also pull in layout-shift.spec.ts,
    # which has its own job (e2e:stability) and is timing-sensitive when four workers share the runner with a thousand other tests.
    - npx playwright test routes layout.spec folds shell

# axe on every route and with the navigation open.
e2e:a11y:
  extends: [.e2e]
  script:
    - npx playwright test axe

# Mega-menu matrix: desktop, mobile touch, no-js, forced-colors, zoom-200.
e2e:menu:
  extends: [.e2e]
  script:
    - npx playwright test menu modes

# Layout stability: CLS under 0.1 on every route at both viewports, and the web fonts swap in without moving the first screen.
e2e:stability:
  extends: [.e2e]
  script:
    - npx playwright test layout-shift

# Team Composer, readiness check, search and copy.
e2e:interaction:
  extends: [.e2e]
  script:
    - npx playwright test interaction

# Wave 7 specs (tests/e2e/wave7/**) at 1440 and 390, in two projects of their own (E2E_WAVE7 adds them to playwright.config.ts) so no
# filter word in another job's command line can pick them up. The rules repeat .qa-rules, each with `exists:`, so a pipeline without
# a wave 7 spec has no such job and is green; the same blocking policy applies once one exists (a unit test keeps the two in step).
e2e:wave7:
  extends: [.e2e]
  variables:
    E2E_WAVE7: "1"
  script:
    - npx playwright test --project=wave7-desktop-1440x900 --project=wave7-mobile-390x844
  rules:
    - if: '$CI_COMMIT_TAG =~ /^release-/'
      exists:
        - tests/e2e/wave7/**/*.spec.ts
      allow_failure: false
    - if: '$CI_COMMIT_BRANCH == "gh-pages" || $CI_COMMIT_BRANCH =~ /negatives$/ || $QA_STRICT == "1"'
      exists:
        - tests/e2e/wave7/**/*.spec.ts
      allow_failure: false
    - if: '$CI_COMMIT_BRANCH'
      exists:
        - tests/e2e/wave7/**/*.spec.ts
      allow_failure: true

# Wave 8 specs (tests/e2e/wave8/**) at 1440 and 390, in two projects of their own (E2E_WAVE8 adds them to playwright.config.ts), for the
# same reason as wave 7. The rules repeat .qa-rules, each with `exists:`, so a pipeline without a wave 8 spec has no such job.
e2e:wave8:
  extends: [.e2e]
  variables:
    E2E_WAVE8: "1"
  script:
    - npx playwright test --project=wave8-desktop-1440x900 --project=wave8-mobile-390x844
  rules:
    - if: '$CI_COMMIT_TAG =~ /^release-/'
      exists:
        - tests/e2e/wave8/**/*.spec.ts
      allow_failure: false
    - if: '$CI_COMMIT_BRANCH == "gh-pages" || $CI_COMMIT_BRANCH =~ /negatives$/ || $QA_STRICT == "1"'
      exists:
        - tests/e2e/wave8/**/*.spec.ts
      allow_failure: false
    - if: '$CI_COMMIT_BRANCH'
      exists:
        - tests/e2e/wave8/**/*.spec.ts
      allow_failure: true

# Gated briefs (D-23, contracts section 5.3): no sentinel or probe sentence of a brief in infra/intake/briefs may appear in dist, in
# any Markdown twin or machine file, in a Pagefind fragment, in src or in docs, and the brief source passes the claims denylist (it never
# reaches dist, where the normal scan runs). It exists only once a brief does. Its self-test runs in the unit suite on every pipeline.
audit:gated:
  extends: [.audit]
  script:
    - npm run audit:gated
    - npm run audit:claims:source
  rules:
    - if: '$CI_COMMIT_TAG =~ /^release-/'
      exists:
        - infra/intake/briefs/*.md
      allow_failure: false
    - if: '$CI_COMMIT_BRANCH == "gh-pages" || $CI_COMMIT_BRANCH =~ /negatives$/ || $QA_STRICT == "1"'
      exists:
        - infra/intake/briefs/*.md
      allow_failure: false
    - if: '$CI_COMMIT_BRANCH'
      exists:
        - infra/intake/briefs/*.md
      allow_failure: true

# GEO audit (WP-41): llms.txt, llms-full.txt, Markdown twins, the Organization graph. WP-41 lands scripts/audit-geo.mjs; until it
# exists there is no job (the rules below are .qa-rules with `exists:`, kept in step by a unit test), so no stub script is needed.
audit:geo:
  extends: [.audit]
  script:
    - npm run audit:geo
  rules:
    - if: '$CI_COMMIT_TAG =~ /^release-/'
      exists:
        - scripts/audit-geo.mjs
      allow_failure: false
    - if: '$CI_COMMIT_BRANCH == "gh-pages" || $CI_COMMIT_BRANCH =~ /negatives$/ || $QA_STRICT == "1"'
      exists:
        - scripts/audit-geo.mjs
      allow_failure: false
    - if: '$CI_COMMIT_BRANCH'
      exists:
        - scripts/audit-geo.mjs
      allow_failure: true

# Forms need a build with an intake endpoint so they render in endpoint mode. The endpoint is a .test host that never resolves:
# every request to it is answered by page.route, nothing leaves the runner.
e2e:forms:
  extends: [.qa-rules, .npm-cache]
  stage: qa
  image: "${PLAYWRIGHT_IMAGE}"
  interruptible: true
  needs: []
  variables:
    CI: "1"
    PUBLIC_WE_INTAKE_API_URL: "https://intake.example.test/api/intake"
    PUBLIC_WE_NEWSLETTER_API_URL: "https://intake.example.test/api/newsletter"
    E2E_REQUIRE_ENDPOINT: "1"
  script:
    - node --version
    - npm ci --prefer-offline --no-audit --no-fund
    - npm run build
    # This is the only build with endpoints: every form origin must be in the page's connect-src and form-action.
    - npm run audit:csp
    - node scripts/lib/export-ledger.mjs reports/ledger.json
    - npx playwright test forms
    # Wave 8 form specs run their endpoint-mode cases here, in the only build that has an endpoint: a test titled @endpoint skips itself
    # elsewhere (it checks the form's data-mode), so e2e:wave8 holds the disabled-mode cases and this command the endpoint ones. E2E_WAVE8 is set
    # on this command alone, so the command above never loads the wave 8 projects, and --grep keeps every other wave 8 test in e2e:wave8.
    - E2E_WAVE8=1 npx playwright test --project=wave8-desktop-1440x900 --project=wave8-mobile-390x844 --grep @endpoint --pass-with-no-tests
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - test-results/
      - playwright-report/

qa:lighthouse:
  extends: [.e2e]
  script:
    - npm run qa:lighthouse

verify:release:
  extends: [.qa-rules, .npm-cache]
  stage: qa
  image: "${NODE_IMAGE}"
  interruptible: true
  needs: []
  script:
    - npm ci --prefer-offline --no-audit --no-fund
    - npm run verify:release
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - reports/release-gate.json
  rules:
    # A release tag and gh-pages run the release gate with no allowances, as the GitHub Actions build does.
    - if: '$CI_COMMIT_TAG =~ /^release-/ || $CI_COMMIT_BRANCH == "gh-pages"'
      variables:
        RELEASE_ALLOW: ""
      allow_failure: false
    - if: '$CI_COMMIT_BRANCH =~ /negatives$/ || $QA_STRICT == "1"'
      allow_failure: false
    - if: '$CI_COMMIT_BRANCH'
      allow_failure: true

# The shared Pages job defaults to Alpine without Node and copies the repository
# source tree. Build the static Astro output in a Node image and publish the
# contents of dist/ at the Pages document root. The preview is path based, so the
# build gets PAGES_BASE_PATH; production (GitHub Pages) has no base.
pages:
  extends: .pages:deploy
  image: "${NODE_IMAGE}"
  variables:
    SITE_DIR: "dist/."
    BUILD_COMMANDS: "npm ci --prefer-offline --no-audit --no-fund && npm run build"
    PAGES_BASE_PATH: "/worldenterprise"
    PUBLIC_PREVIEW: "1"
    PUBLIC_STYLEGUIDE: "1"
    GIT_DEPTH: "0"
  needs:
    - job: verify:static
      artifacts: false

# Release confirmation on a release tag (WP-30, issue #20, decisions R-1 and DP-1). This job does not push. GitHub is fed by the nightly
# weg-ghpages-mirror CronJob (nebula, tools/weg-ghpages-mirror): it fast-forwards GitLab gh-pages to GitHub gh-pages with its own
# short-lived GitHub App installation token, worldenterprise is on its allowlist, and it never forces. So this project holds no
# GitHub credential (the former GITHUB_TOKEN push, which used --force, is gone) and has no way to overwrite GitHub.
#
# Release N ships from a tag, not from the head of demo (DP-1): wave work keeps landing on demo while a release is being approved.
# The job exists only on a pipeline for a tag named release-* (protected, so only maintainers create one and protected variables
# reach it) and scripts/ci/require-release-approval.sh refuses a branch pipeline and an unprotected tag. It is manual and blocked
# until the operator supplies RELEASE_APPROVED=<the commit being released> (the owner runs the job with that variable). It then
# checks, read-only and without credentials, that GitHub gh-pages is at this pipeline's commit and fails otherwise (not yet mirrored, diverged, unreadable), so a release that did not land never shows green. The template's
# script, which ended with exit 0 ("skipping mirror") when GITHUB_REPO or GITHUB_TOKEN was unset (code-security P1-3), is replaced.
# The template's rules are replaced too so that `when: manual` is explicit and release tags only.
#
# The effective publication controls sit upstream of this job and are listed in .astro-magazine/release/RELEASE.md: only the owner
# may push gh-pages (protected, no force), and the GitHub Actions build re-runs the release gate with no allowances.
mirror:
  extends: .mirror:github
  rules:
    - if: '$CI_COMMIT_TAG =~ /^release-/'
      when: manual
      allow_failure: false
  script:
    - echo "=== Confirm gh-pages is mirrored to GitHub ==="
    - sh scripts/ci/require-release-approval.sh
    - sh scripts/ci/confirm-mirror.sh
  needs:
    - job: verify:static
      artifacts: false
    - job: audit:claims
      artifacts: false
    - job: audit:images
      artifacts: false
    - job: audit:links
      artifacts: false
    - job: audit:ledger
      artifacts: false
    - job: audit:dist
      artifacts: false
    - job: audit:a11y
      artifacts: false
    - job: audit:wired
      artifacts: false
    - job: e2e:routes
      artifacts: false
    - job: e2e:a11y
      artifacts: false
    - job: e2e:menu
      artifacts: false
    - job: e2e:interaction
      artifacts: false
    - job: e2e:stability
      artifacts: false
    - job: e2e:forms
      artifacts: false
    # The wave 7 jobs exist only once their files do, so the release confirmation waits for them when present and skips them when not.
    - job: e2e:wave7
      artifacts: false
      optional: true
    - job: e2e:wave8
      artifacts: false
      optional: true
    - job: audit:gated
      artifacts: false
      optional: true
    - job: audit:geo
      artifacts: false
      optional: true
    - job: qa:lighthouse
      artifacts: false
    - job: verify:release
      artifacts: false
